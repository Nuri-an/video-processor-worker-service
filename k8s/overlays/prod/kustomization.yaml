apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../deployment.yaml
  - ../../pdb.yaml
  - ../../hpa.yaml

images:
  - name: video-processor-worker
    newName: nuriancoelho/video-processor-worker
    newTag: latest

patches:
  - target:
      kind: Deployment
      name: video-processor-worker
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Always
